<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | DigitalLearn</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f0fdf4);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .register-box {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .brand {
            text-align: center;
            color: #2563eb;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #111827;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #00875a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }

        .login-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6d28d9;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="register-box">
        <div class="brand">DigitalLearn</div>

        <h1>Create Account</h1>

        <form id="registerForm">
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password"
                minlength="6"
                required
            >

            <button type="submit" id="registerButton">
                Create Account
            </button>
        </form>

        <p id="message"></p>

        <a href="login.html" class="login-link">
            Already have an account? Login
        </a>
    </div>

    <script>
        const API_URL = "https://digitallearn-backend.onrender.com";

        document.getElementById("registerForm")
            .addEventListener("submit", async function(event) {
                event.preventDefault();

                const name = document.getElementById("name").value.trim();
                const email = document.getElementById("email").value.trim().toLowerCase();
                const password = document.getElementById("password").value;
                const button = document.getElementById("registerButton");
                const message = document.getElementById("message");

                button.disabled = true;
                button.textContent = "Creating account...";
                message.textContent = "";

                try {
                    const response = await fetch(`${API_URL}/api/register`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            name: name,
                            email: email,
                            password: password
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        message.style.color = "#00875a";
                        message.textContent = data.message || "Registration successful!";

                        setTimeout(() => {
                            window.location.href = "login.html";
                        }, 1200);
                    } else {
                        message.style.color = "#dc2626";
                        message.textContent = data.message || "Registration failed.";
                    }
                } catch (error) {
                    message.style.color = "#dc2626";
                    message.textContent =
                        "Server se connect nahi ho pa raha. Please try again.";
                } finally {
                    button.disabled = false;
                    button.textContent = "Create Account";
                }
            });
    </script>

</body>
</html>
